<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Form Validation</title>
</head>

<body>
    <h1>Student Marks Calculator</h1>

    <form id="marksForm">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" required>
        <br><br>

        <label for="marks">Marks out of 100:</label>
        <input type="number" id="marks" min="0" max="100" required>
        <br><br>

        <button type="submit">Calculate Result</button>
    </form>

    <p id="result">Enter the details to calculate the result.</p>

    <script>
        const marksForm = document.getElementById("marksForm");
        const studentName = document.getElementById("studentName");
        const marks = document.getElementById("marks");
        const result = document.getElementById("result");

        marksForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const name = studentName.value.trim();
            const score = Number(marks.value);

            if (name === "" || marks.value === "" ||
                score < 0 || score > 100) {
                result.textContent = "Please enter valid details.";
                return;
            }

            result.textContent =
                `${name} scored ${score} out of 100.`;
        });
    </script>
</body>

</html>
